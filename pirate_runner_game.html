            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: gameCanvas, antialias: true });
            renderer.setSize(window.innerWidth * 0.8, window.innerHeight * 0.8); // 80% of window size
            renderer.setPixelRatio(window.devicePixelRatio); // For sharper rendering on high-DPI screens

            // Adjust canvas size on window resize
            window.addEventListener('resize', onWindowResize, false);

            // Set camera position
            camera.position.set(0, 3, 10); // Look down the "road"
            camera.lookAt(0, 0, 0);

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0x404040); // Soft white light
            scene.add(ambientLight);

            // Add directional light (for sun)
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(0, 20, -50); // Position high and slightly behind for sun effect
            scene.add(directionalLight);

            // Create the player
            const playerGeometry = new THREE.BoxGeometry(0.8, 1.5, 0.8); // Pirate body
            const playerMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 }); // Red pirate
            player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.set(playerLanePositions[currentLane], 0.75, 5); // Start in middle lane, slightly above ground
            player.castShadow = true;
            scene.add(player);

            // Create the water lanes (ground)
            const waterGeometry = new THREE.PlaneGeometry(laneWidth * numberOfLanes + 2, 200); // Wide and long plane
            const waterMaterial = new THREE.MeshPhongMaterial({ color: 0x0077be, side: THREE.DoubleSide }); // Blue water
            const water = new THREE.Mesh(waterGeometry, waterMaterial);
            water.rotation.x = -Math.PI / 2; // Rotate to lie flat
            water.position.y = 0; // Ground level
            water.receiveShadow = true;
            scene.add(water);

            // Add waves to the water
            const waveGeometry = new THREE.PlaneGeometry(laneWidth * numberOfLanes + 2, 200, 20, 200); // More segments for waves
            const waveMaterial = new THREE.MeshPhongMaterial({ color: 0x0099ff, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
            waves = new THREE.Mesh(waveGeometry, waveMaterial);
            waves.rotation.x = -Math.PI / 2;
            waves.position.y = 0.05; // Slightly above the main water plane
            scene.add(waves);

            // Create the sky
            const skyGeometry = new THREE.SphereGeometry(500, 32, 32); // Large sphere for skybox
            const skyMaterial = new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide }); // Light blue sky
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);

            // Create the sun
            const sunGeometry = new THREE.SphereGeometry(5, 32, 32);
            const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xFDB813 }); // Yellow/Orange sun
            sun = new THREE.Mesh(sunGeometry, sunMaterial);
            sun.position.set(0, 100, -200); // Position the sun high in the distance
            scene.add(sun);

            // Initialize Tone.js synth for accordion sound
            accordionSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: {
                    type: "sawtooth" // Sawtooth wave for a buzzy, accordion-like sound
                },
                envelope: {
                    attack: 0.02,
                    decay: 0.5,
                    sustain: 0.8,
                    release: 0.5
                },
                volume: -10 // Adjust volume
            }).toDestination();

            // Define a simple accordion melody loop
            const notes = ["C3", "E3", "G3", "C4", "G3", "E3"];
            musicLoop = new Tone.Sequence((time, note) => {
                accordionSynth.triggerAttackRelease(note, "8n", time);
            }, notes, "4n"); // Play each note for an 8th note, sequence advances every quarter note

            musicLoop.loop = true; // Loop the melody
            Tone.Transport.bpm.value = 100; // Set tempo

            // Load high score from local storage
            highScore = parseInt(localStorage.getItem('pirateRunnerHighScore') || '0');
            highScoreDisplay.textContent = `High Score: ${highScore}`;

            // Initial UI state
            scoreDisplay.style.display = 'none';
            messageBox.style.display = 'block';

            // Start button listener
            startButton.addEventListener('click', startGame);
            // Download button listener
            downloadButton.addEventListener('click', downloadGame);

            // Keyboard controls
            document.addEventListener('keydown', onKeyDown);
        }

        // --- Game State Management ---
        async function startGame() {
            gameOver = false;
            paused = false; // Ensure game is not paused when starting
            score = 0;
            gameSpeed = 0.15;
            scoreDisplay.textContent = 'Score: 0';
            scoreDisplay.style.display = 'block';
            messageBox.style.display = 'none';

            // Start Tone.js audio context (required for web audio)
            await Tone.start();
            console.log("Audio context started");
            musicLoop.start(0); // Start the music loop from the beginning
            Tone.Transport.start(); // Start the Tone.js transport

            // Reset player position
            player.position.set(playerLanePositions[1], 0.75, 5);
            currentLane = 1;
            jumpState = { isJumping: false, initialY: 0.75, jumpHeight: 2, jumpSpeed: 0.05, currentJumpVelocity: 0 };
            slideState = { isSliding: false, initialScaleY: 1, slideScaleY: 0.5, slideDuration: 500, slideTimer: 0 };
            player.scale.y = 1; // Reset scale

            // Clear existing obstacles and collectibles
            obstacles.forEach(obj => scene.remove(obj));
            obstacles = [];
            collectibles.forEach(obj => scene.remove(obj));
            collectibles = [];
            obstaclesRemovedThisFrame = 0; // Reset counter

            // Clear existing clouds
            clouds.forEach(cloud => scene.remove(cloud));
            clouds = [];

            // --- Initial obstacle spawn: 2 obstacles ---
            let initialSpawnZ = camera.position.z - 50; // Start spawning well ahead of the camera
            for (let i = 0; i < 2; i++) {
                const randomLane = Math.floor(Math.random() * numberOfLanes);
                const obstacleTypes = ['marine', 'boat', 'shark', 'shipwreck', 'rock'];
                const randomType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
                createObstacle(randomType, randomLane, initialSpawnZ - (i * obstacleSpawnInterval * 1.5)); // Space them out
            }


            // Start the game loop
            animate();
        }

        function endGame() {
            gameOver = true;
            paused = false; // Ensure game is not paused when ending
            messageBox.style.display = 'block';
            scoreDisplay.style.display = 'none';

            // Check and update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('pirateRunnerHighScore', highScore.toString());
                highScoreDisplay.textContent = `NEW High Score: ${highScore}!`; // Indicate new high score
                gameMessage.innerHTML = `Your final score: <span class="font-bold text-cyan-400">${score}</span><br>Congratulations!`;
            } else {
                highScoreDisplay.textContent = `High Score: ${highScore}`; // Show existing high score
                gameMessage.innerHTML = `Your final score: <span class="font-bold text-cyan-400">${score}</span><br>Press "Start Game" to play again.`;
            }

            messageBox.querySelector('h2').textContent = 'Game Over!';
            startButton.textContent = 'Play Again';

            // Stop the music when the game ends
            musicLoop.stop();
            Tone.Transport.stop();
        }

        function togglePause() {
            if (gameOver) return; // Cannot pause if game is over

            paused = !paused;

            if (paused) {
                // Pause the game
                Tone.Transport.pause(); // Pause music
                messageBox.querySelector('h2').textContent = 'Game Paused';
                gameMessage.textContent = 'Press Escape or Resume to continue.';
                highScoreDisplay.style.display = 'none'; // Hide high score when paused
                startButton.textContent = 'Resume Game';
                messageBox.style.display = 'block';
                scoreDisplay.style.display = 'none';
            } else {
                // Resume the game
                Tone.Transport.start(); // Resume music
                messageBox.style.display = 'none';
                scoreDisplay.style.display = 'block';
                // Restart animation loop
                animate();
            }
        }

        // --- Player Actions ---
        function movePlayer(direction) {
            if (gameOver || paused) return; // Cannot move if game is over or paused

            let newLane = currentLane + direction;
            if (newLane >= 0 && newLane < numberOfLanes) {
                currentLane = newLane;
                // Animate player movement to new lane
                new TWEEN.Tween(player.position)
                    .to({ x: playerLanePositions[currentLane] }, 150) // 150ms transition
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .start();
            }
        }

        function jump() {
            if (gameOver || paused || jumpState.isJumping || slideState.isSliding) return; // Cannot jump if game is over or paused
            jumpState.isJumping = true;
            jumpState.currentJumpVelocity = jumpState.jumpSpeed; // Initial upward velocity
        }

        function slide() {
            if (gameOver || paused || jumpState.isJumping || slideState.isSliding) return; // Cannot slide if game is over or paused
            slideState.isSliding = true;
            slideState.slideTimer = Date.now();
            player.scale.y = slideState.slideScaleY; // Shrink player
            player.position.y = slideState.slideScaleY * jumpState.initialY; // Adjust position to stay on ground
        }

        // --- Obstacle/Collectible Generation ---
        // Modified to accept a specific Z position for spawning
        function createObstacle(type, lane, zPosition) {
            let geometry, material, height, width, depth, yOffset;
            let obstacleMesh;

            switch (type) {
                case 'marine':
                    geometry = new THREE.BoxGeometry(0.8, 1.8, 0.8);
                    material = new THREE.MeshPhongMaterial({ color: 0x0000ff }); // Blue marine
                    height = 1.8;
                    yOffset = height / 2;
                    obstacleMesh = new THREE.Mesh(geometry, material);
                    break;
                case 'boat':
                    geometry = new THREE.BoxGeometry(laneWidth * 0.8, 0.5, 2);
                    material = new THREE.MeshPhongMaterial({ color: 0x8B4513 }); // Brown boat
                    height = 0.5;
                    yOffset = height / 2;
                    obstacleMesh = new THREE.Mesh(geometry, material);
                    break;
                case 'shark':
                    // Simple shark fin shape, now light blue
                    geometry = new THREE.ConeGeometry(0.5, 1, 8);
                    material = new THREE.MeshPhongMaterial({ color: 0x00BFFF }); // Light blue shark
                    height = 1;
                    yOffset = height / 2;
                    obstacleMesh = new THREE.Mesh(geometry, material);
                    obstacleMesh.rotation.x = Math.PI / 2; // Point fin upwards
                    break;
                case 'shipwreck':
                    // Shipwreck as a brown cube
                    geometry = new THREE.BoxGeometry(laneWidth * 0.9, 2, 3); // Wider and taller
                    material = new THREE.MeshPhongMaterial({ color: 0x8B4513 }); // Brown for wood
                    height = 2;
                    yOffset = height / 2;
                    obstacleMesh = new THREE.Mesh(geometry, material);
                    break;
                case 'rock':
                    // Rock as a grey cube
                    geometry = new THREE.BoxGeometry(0.7, 0.7, 0.7); // Cube shape for rock
                    material = new THREE.MeshPhongMaterial({ color: 0x808080 }); // Grey for rock
                    height = 0.7;
                    yOffset = height / 2;
                    obstacleMesh = new THREE.Mesh(geometry, material);
                    break;
            }

            obstacleMesh.position.set(playerLanePositions[lane], yOffset, zPosition); // Use provided zPosition
            obstacleMesh.castShadow = true;
            obstacleMesh.userData = { type: type, height: height, width: width || geometry.parameters.width, depth: depth || geometry.parameters.depth };
            scene.add(obstacleMesh);
            obstacles.push(obstacleMesh);
        }

        // Helper function to spawn a single new obstacle far ahead
        function spawnSingleNewObstacleAhead() {
            const randomLane = Math.floor(Math.random() * numberOfLanes);
            const obstacleTypes = ['marine', 'boat', 'shark', 'shipwreck', 'rock'];
            const randomType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];

            // Find the furthest Z position among existing obstacles to spawn new ones even further
            let furthestZ = camera.position.z - 50; // Default if no obstacles
            if (obstacles.length > 0) {
                // Find the obstacle with the smallest (most negative) Z position, as they move towards positive Z
                furthestZ = Math.min(...obstacles.map(o => o.position.z));
            }

            // Spawn a new obstacle even further down the track
            const spawnZ = furthestZ - obstacleSpawnInterval - (Math.random() * 5); // Add some randomness for varied spacing
            createObstacle(randomType, randomLane, spawnZ);
        }


        function createCollectible(lane, zPosition) {
            const geometry = new THREE.SphereGeometry(0.4, 16, 16);
            const material = new THREE.MeshPhongMaterial({ color: 0xffd700 }); // Gold coin
            const collectibleMesh = new THREE.Mesh(geometry, material);
            collectibleMesh.position.set(playerLanePositions[lane], 0.5, zPosition + Math.random() * 5 - 2.5); // Spawn near obstacle
            collectibleMesh.userData = { type: 'coin' };
            scene.add(collectibleMesh);
            collectibles.push(collectibleMesh);
        }

        function createCloud() {
            const cloudGeometry = new THREE.BoxGeometry(2 + Math.random() * 3, 1 + Math.random() * 2, 1 + Math.random() * 2);
            const cloudMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
            const cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);

            // Position clouds randomly in the sky, ahead of the camera
            cloud.position.set(
                (Math.random() - 0.5) * 50, // X position
                20 + Math.random() * 10, // Y position (height)
                camera.position.z - 100 - Math.random() * cloudSpawnDistance // Z position (ahead of camera)
            );
            scene.add(cloud);
            clouds.push(cloud);
        }

        function spawnClouds() {
            if (clouds.length < maxClouds) {
                createCloud();
            }
        }

        // --- Collision Detection ---
        function checkCollisions() {
            const playerBox = new THREE.Box3().setFromObject(player);

            // Check obstacle collisions
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                const obstacleBox = new THREE.Box3().setFromObject(obstacle);

                if (playerBox.intersectsBox(obstacleBox)) {
                    // Specific collision logic based on obstacle type and player state
                    if (obstacle.userData.type === 'marine') {
                        if (slideState.isSliding) {
                            // Player slides under marine (if marine is tall enough)
                            // For simplicity, let's say sliding avoids marines entirely for now
                            // In a more complex game, marine height vs slide height would matter
                            // For now, any collision with marine means game over unless player jumps over it
                            if (player.position.y < obstacle.userData.height / 2) { // If player is not jumping over it
                                endGame();
                                return;
                            }
                        } else if (jumpState.isJumping) {
                            // If player jumps over marine, no collision
                            if (player.position.y > obstacle.userData.height / 2) {
                                continue; // No collision if jumping over
                            } else {
                                endGame();
                                return;
                            }
                        } else {
                            endGame();
                            return;
                        }
                    } else if (obstacle.userData.type === 'boat') {
                        // Boats are low, so jumping over them is the way
                        if (player.position.y < obstacle.userData.height / 2 + 0.5) { // If player doesn't jump high enough
                            endGame();
                            return;
                        }
                    } else if (obstacle.userData.type === 'shark') {
                        // Sharks are in the water, player must jump or be on a boat (not implemented boats as platforms)
                        // For now, if player is on ground level and hits shark, game over
                        if (player.position.y < obstacle.userData.height / 2 + 0.5) {
                            endGame();
                            return;
                        }
                    } else if (obstacle.userData.type === 'shipwreck') {
                        // Shipwrecks are tall, require sliding under or jumping over
                        if (!slideState.isSliding && player.position.y < obstacle.userData.height / 2) {
                            endGame();
                            return;
                        }
                    } else if (obstacle.userData.type === 'rock') {
                        // Rocks are low, require jumping over
                        if (!jumpState.isJumping && player.position.y < obstacle.userData.height / 2 + 0.5) {
                            endGame();
                            return;
                        }
                    }
                    else {
                        // Generic collision for other obstacles
                        endGame();
                        return;
                    }
                }

                // Remove obstacles that are behind the player
                if (obstacle.position.z > camera.position.z + 5) { // If obstacle is behind camera
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                    obstaclesRemovedThisFrame++; // Increment counter when an obstacle is removed
                }
            }

            // Check collectible collisions
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const collectible = collectibles[i];
                const collectibleBox = new THREE.Box3().setFromObject(collectible);

                if (playerBox.intersectsBox(collectibleBox)) {
                    score += 10; // Add score for collecting
                    scoreDisplay.textContent = `Score: ${score}`;
                    scene.remove(collectible);
                    collectibles.splice(i, 1);
                }

                // Remove collectibles that are behind the player
                if (collectible.position.z > camera.position.z + 5) {
                    scene.remove(collectible);
                    collectibles.splice(i, 1);
                }
            }
        }

        // --- Game Loop ---
        function animate() {
            if (gameOver || paused) { // Stop animation if game is over or paused
                // Only render the final state if game is over, or if paused, just render current state
                renderer.render(scene, camera);
                return;
            }

            requestAnimationFrame(animate);

            // Update player jump state
            if (jumpState.isJumping) {
                player.position.y += jumpState.currentJumpVelocity;
                jumpState.currentJumpVelocity -= 0.005; // Gravity

                if (player.position.y <= jumpState.initialY) {
                    player.position.y = jumpState.initialY;
                    jumpState.isJumping = false;
                    jumpState.currentJumpVelocity = 0;
                }
            }

            // Update player slide state
            if (slideState.isSliding) {
                if (Date.now() - slideState.slideTimer > slideState.slideDuration) {
                    slideState.isSliding = false;
                    player.scale.y = slideState.initialScaleY; // Restore player scale
                    player.position.y = jumpState.initialY; // Restore player Y position
                }
            }

            // Animate waves (subtle up-and-down motion)
            if (waves) {
                waves.position.y = 0.05 + Math.sin(Date.now() * 0.005) * 0.1; // Gentle bobbing
            }

            // Move obstacles and collectibles
            obstacles.forEach(obstacle => {
                obstacle.position.z += gameSpeed;
            });
            collectibles.forEach(collectible => {
                collectible.position.z += gameSpeed;
                // Rotate collectibles for visual appeal
                collectible.rotation.y += 0.05;
            });

            // Move clouds and remove if behind camera
            for (let i = clouds.length - 1; i >= 0; i--) {
                const cloud = clouds[i];
                cloud.position.z += gameSpeed * 0.5; // Clouds move slower than obstacles

                if (cloud.position.z > camera.position.z + 50) { // If cloud is far behind camera
                    scene.remove(cloud);
                    clouds.splice(i, 1);
                }
            }

            // Update score based on distance
            score += Math.floor(gameSpeed * 10);
            scoreDisplay.textContent = `Score: ${score}`;

            // Increase game speed gradually
            gameSpeed += 0.00005;

            // Spawn 2 new obstacles for each one that was removed in the previous frame
            if (obstaclesRemovedThisFrame > 0) {
                for (let i = 0; i < obstaclesRemovedThisFrame * 2; i++) {
                    // Ensure we don't spawn excessively if the game is somehow lagging
                    if (obstacles.length < maxObstacles * 2) { // Allow up to double the max for burst spawns
                        spawnSingleNewObstacleAhead();
                    }
                }
                obstaclesRemovedThisFrame = 0; // Reset counter
            }

            spawnClouds(); // Spawn new clouds
            checkCollisions();

            TWEEN.update(); // Update any active tweens (for player lane movement)
            renderer.render(scene, camera);
        }

        // --- Event Handlers ---
        function onKeyDown(event) {
            // Handle pause key separately, even if game is over
            if (event.key === 'Escape') {
                togglePause();
                return; // Prevent other actions when pausing/unpausing
            }

            if (gameOver || paused) return; // Prevent actions if game is over or paused

            // Convert key to lowercase to handle both 'W' and 'w' etc.
            const key = event.key.toLowerCase();

            switch (key) {
                case 'arrowleft':
                case 'a':
                    movePlayer(-1);
                    break;
                case 'arrowright':
                case 'd':
                    movePlayer(1);
                    break;
                case 'arrowup':
                case 'w':
                    jump();
                    break;
                case 'arrowdown':
                case 's':
                    slide();
                    break;
            }
        }

        // --- Download Functionality ---
        function downloadGame() {
            // Get the entire HTML content of the current document
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'pirate_runner_game.html'; // Suggested file name
            document.body.appendChild(a); // Append to body to make it clickable
            a.click(); // Programmatically click the link to trigger download
            document.body.removeChild(a); // Clean up the temporary link
            URL.revokeObjectURL(url); // Release the object URL
        }


        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * 0.8, window.innerHeight * 0.8);
        }

        // Initialize the game when the window loads
        window.onload = function() {
            init();
        };

        // --- TWEEN.js (for smooth animations) ---
        // This is a simplified version of TWEEN.js, just enough for basic easing.
        // For a full version, you'd typically include it from a CDN.
        // I'm including a minimal version here to make the code self-contained.
        var TWEEN = TWEEN || (function () {
            var _tweens = [];
            return {
                getAll: function () {
                    return _tweens;
                },
                removeAll: function () {
                    _tweens = [];
                },
                add: function (tween) {
                    _tweens.push(tween);
                },
                remove: function (tween) {
                    var i = _tweens.indexOf(tween);
                    if (i !== -1) {
                        _tweens.splice(i, 1);
                    }
                },
                update: function (time) {
                    if (time === undefined) {
                        time = Date.now();
                    }
                    if (_tweens.length === 0) return false;
                    var i = 0;
                    while (i < _tweens.length) {
                        if (_tweens[i].update(time)) {
                            i++;
                        } else {
                            _tweens.splice(i, 1);
                        }
                    }
                    return true;
                }
            };
        })();

        TWEEN.Tween = function (object) {
            var _object = object;
            var _valuesStart = {};
            var _valuesEnd = {};
            var _duration = 1000;
            var _easingFunction = TWEEN.Easing.Linear.None;
            var _startTime = null;
            var _onUpdateCallback = null;
            var _onCompleteCallback = null;

            this.to = function (properties, duration) {
                if (duration !== undefined) {
                    _duration = duration;
                }
                _valuesEnd = properties;
                return this;
            };

            this.start = function (time) {
                TWEEN.add(this);
                _startTime = time !== undefined ? time : Date.now();
                for (var property in _valuesEnd) {
                    if (_object[property] === undefined) {
                        continue;
                    }
                    _valuesStart[property] = _object[property];
                }
                return this;
            };

            this.stop = function () {
                TWEEN.remove(this);
                return this;
            };

            this.easing = function (easingFunction) {
                _easingFunction = easingFunction;
                return this;
            };

            this.onUpdate = function (callback) {
                _onUpdateCallback = callback;
                return this;
            };

            this.onComplete = function (callback) {
                _onCompleteCallback = callback;
                return this;
            };

            this.update = function (time) {
                if (time === undefined) {
                    time = Date.now();
                }
                if (time < _startTime) {
                    return true;
                }
                var elapsed = (time - _startTime) / _duration;
                elapsed = elapsed > 1 ? 1 : elapsed;
                var value = _easingFunction(elapsed);

                for (var property in _valuesStart) {
                    var start = _valuesStart[property];
                    var end = _valuesEnd[property];
                    _object[property] = start + (end - start) * value;
                }

                if (_onUpdateCallback !== null) {
                    _onUpdateCallback.call(_object, value);
                }

                if (elapsed === 1) {
                    if (_onCompleteCallback !== null) {
                        _onCompleteCallback.call(_object);
                    }
                    return false;
                }
                return true;
            };
        };

        TWEEN.Easing = {
            Linear: {
                None: function (k) {
                    return k;
                }
            },
            Quadratic: {
                In: function (k) {
                    return k * k;
                },
                Out: function (k) {
                    return k * (2 - k);
                },
                InOut: function (k) {
                    if ((k *= 2) < 1) return 0.5 * k * k;
                    return -0.5 * (--k * (k - 2) - 1);
                }
            }
        };

    </script>
